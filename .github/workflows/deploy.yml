name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comprobar que el sitio compila
        env:
          SITE_URL: https://turno.revilla.org
        run: |
          python3 build.py
          test -f public/index.html
          test -f public/feed.xml
          echo "Entradas generadas:"
          ls -1 public/p/

      # El despliegue NO ocurre aquí: el sitio se sirve desde el servidor
      # propio (Caddy). Tras hacer push, ejecuta el script de despliegue
      # en el servidor. Ver README, sección "Publicar".
